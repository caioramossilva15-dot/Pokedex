<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="resources/css/trainer.css">
</head>
<body>
    <!-- BARRA DE NAVEGAÇÃO -->
    <header>
        <nav class="navbar">
            <div class="nav_logo">
                <img class="logo_icone" src="resources/img/poke_logo.png" alt="Ícone Pokébola">
                <img class="logo_texto" src="resources/img/Logo.png" alt="Logo Pokedesk">
            </div>

            <ul class="nav_menu">
                <li><a href="Pokedex.html">Início</a></li>
                <li><a href="favoritos.html">Favoritos</a></li>
                <li><a href="#">Perfil</a></li>
            </ul>

            <button class="btn-tema" onclick="mudarTema()">Mudar Tema</button>
        </nav>
    </header>

    <main class="treinador-page">

    <!-- Estado: criar treinador -->
    <section class="hero" id="hero-treinador">
        <p>Nenhum treinador carregado no momento . . .</p>
        <div class="hero-btns">
            <button class="btn" id="cadastro">Criar Treinador</button>
            <p>Ou</p>
            <button class="btn" id="login">Entrar</button>
        </div>
    </section>

    <section class="treinador">
        <section id="criar-treinador" class="treinador-card">
            <button class="quit-form">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M10 14H8v-2H6v-2H4V8h2V6h2V4h2v4h10v12h-8v-2h6v-8h-8v4Z"/>
                </svg>
            </button>

            <h1>Crie seu treinador</h1>

            <section class="formulario" autocomplete="off">
                <div class="treinador-extras">
                    <div class="trainer-logo"><img src="resources/img/icons/Blue.jpg"></div>
                    <section class="btns-logo">
                        <button class="arrow-btn" id="left-arrow">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M15 17h-2v-2h-2v-2H9v-2h2V9h2V7h2v10Z"/></svg>
                        </button>
                        <button class="arrow-btn" id="right-arrow">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M9 17h2v-2h2v-2h2v-2h-2V9h-2V7H9v10Z"/></svg>
                        </button>
                    </div>
                </div>

                <form class="form-treinador" id="form-treinador">
                    <label class="nome" name="nome" alt="Nome:">Nome:</label>
                    <input class="item-style" type="text" id="nome" placeholder="Nome" required>

                    <label class="sobrenome" name="sobrenome" alt="Sobrenome:">Sobrenome:</label>
                    <input class="item-style" type="text" id="sobrenome" placeholder="Sobrenome" required>

                    <label class="username" name="username" alt="Nome de usuário:">Nome de usuário:</label>
                    <input class="item-style" type="text" id="username" placeholder="Username" required>

                    <label class="nascimento" name="nascimento" alt="Data de nascimento:">Data de Nascimento:</label>
                    <input class="item-style" type="date" id="nascimento" required>

                    <button class="card-button" type="submit">
                        Criar treinador
                    </button>

                </form>
            </section>

        </section>


        <!-- Estado: entrar com treinador existente -->
        <section id="entrar-treinador" class="treinador-card">
            <button class="quit-form">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M10 14H8v-2H6v-2H4V8h2V6h2V4h2v4h10v12h-8v-2h6v-8h-8v4Z"/>
                </svg>
            </button>
            <h1>Já possui um treinador?</h1>

            <form class="form-treinador" id="form-login" autocomplete="off">

                <input class="item-style" type="text" id="username-login" placeholder="Digite seu username" required>

                <button class="card-button" id="btn-entrar" type="submit">
                    Entrar
                </button>
            </form>

        </section>
        


        <!-- Perfil carregado pela API -->
        <section id="perfil-treinador" class="treinador-card">

            <div class="trainer-acount">
                <div class="treinador-extras l-itens">
                    <div class="trainer-logo"><img src="resources/img/icons/Blue.jpg" alt="Ícone do treinador"></div>
                    <section class="btns-logo profile-icon-controls" aria-label="Editar ícone do treinador">
                        <button class="arrow-btn" id="left-arrow-perfil" type="button" aria-label="Ícone anterior">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M15 17h-2v-2h-2v-2H9v-2h2V9h2V7h2v10Z"/></svg>
                        </button>
                        <button class="arrow-btn" id="right-arrow-perfil" type="button" aria-label="Próximo ícone">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M9 17h2v-2h2v-2h2v-2h-2V9h-2V7H9v10Z"/></svg>
                        </button>
                        <button class="arrow-btn confirmar-icone" id="confirmar-icone" type="button" aria-label="Confirmar alteração do ícone" title="Salvar ícone">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
                        </button>
                    </section>
                </div>

                <div class="trainer-body">
                    <h1 id="perfil-nome"></h1>
                    <div class="trainer-user-info">
                        <p id="perfil-username"></p>
                        <p id="perfil-nascimento"></p>
                    </div>
                </div>
            </div>

            <form class="form-treinador">
                <label class="nome" name="nome" alt="Nome:">Nome:</label>
                <input class="item-style" type="text" id="nome" placeholder="Nome" disabled>

                <label class="sobrenome" name="sobrenome" alt="Sobrenome:">Sobrenome:</label>
                <input class="item-style" type="text" id="sobrenome" placeholder="Sobrenome" disabled>

                <label class="username" name="username" alt="Nome de usuário:">Nome de usuário:</label>
                <input class="item-style" type="text" id="username" placeholder="Username" disabled>

                <label class="nascimento" name="nascimento" alt="Data de nascimento:">Data de Nascimento:</label>
                <input class="item-style" type="date" id="nascimento" disabled>
            </form>

            <button class="quit-form" id="btn-logout" onclick="sairDaConta()">
                <svg class="icon-logout" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M20 7h-2V4H6v16h12v-3h2v5H4V2h16v5Zm-4 2h2v2h2v2h-2v2h-2v2h-2v-4H8v-2h6V7h2v2Z"/>
                </svg>
            </button>

            <section class="profile-btns">
            <button class="btn-style profile-infos" name="infos">
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M4 11v2h16v-2zm12 2v2h2v-2zm-2 2v2h2v-2zm-2 2v2h2v-2zm4-6V9h2v2z"/><path d="M14 15V7h2v8zm-2 2V5h2v12z"/>
                </svg>
                <p>INFORMAÇÕES</p>
            </button>

            <button class="btn-style profile-favs" name="favs">
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M4 11v2h16v-2zm12 2v2h2v-2zm-2 2v2h2v-2zm-2 2v2h2v-2zm4-6V9h2v2z"/><path d="M14 15V7h2v8zm-2 2V5h2v12z"/>
                </svg>
                <p>FAVORITOS</p>
            </button>

            <button class="btn-style profile-memories" name="memories">
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M4 11v2h16v-2zm12 2v2h2v-2zm-2 2v2h2v-2zm-2 2v2h2v-2zm4-6V9h2v2z"/><path d="M14 15V7h2v8zm-2 2V5h2v12z"/>
                </svg>
                <p>MEMÓRIAS</p>
            </button>
        </section>

        </section>

        
    </section>
    <script src="resources/js/Trainer.js"></script>
</main>
</body>
</html>
